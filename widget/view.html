<style>
/* FortiSOAR-style column filter dropdowns (jtgColumnFilter directive). The
   menu is appended to <body> (uib dropdown-append-to-body) so these .jtg-*
   rules are intentionally global, not scoped under .widget. */
.jtg-colfilter { width: 100%; }
.jtg-colfilter .jtg-toggle {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; padding: 2px 6px; font-size: 12px; line-height: 18px;
    color: inherit; text-decoration: none; cursor: pointer;
    border: 1px solid rgba(128,128,128,0.4); border-radius: 2px;
    background: transparent;
}
.jtg-colfilter .jtg-toggle:hover { border-color: rgba(128,128,128,0.7); }
.jtg-colfilter .jtg-toggle-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jtg-colfilter .jtg-caret { margin-left: 6px; opacity: 0.6; }
.jtg-menu { min-width: 200px; max-height: 320px; overflow-y: auto; padding: 4px 0; z-index: 1100; }
.jtg-menu .jtg-menu-title { padding: 4px 12px; font-weight: 600; border-bottom: 1px solid rgba(128,128,128,0.25); margin-bottom: 4px; }
.jtg-menu > li > a { display: block; padding: 5px 12px; cursor: pointer; white-space: nowrap; text-decoration: none; }
.jtg-menu > li > a:hover { background: rgba(128,128,128,0.15); }
.jtg-menu .jtg-enum { padding: 6px 12px; }
.jtg-menu .jtg-enum-search { margin-bottom: 6px; }
.jtg-menu .jtg-allrow { display: flex; gap: 12px; margin-bottom: 6px; font-size: 12px; }
.jtg-menu .jtg-allrow a { cursor: pointer; text-decoration: none; }
.jtg-menu .jtg-check { display: block; font-weight: 400; margin-bottom: 4px; cursor: pointer; }
.jtg-menu .jtg-check input { margin-right: 6px; }
.jtg-menu .jtg-apply { width: 100%; margin-top: 6px; }
/* Custom-range popup ($uibModal, appended to <body> — global selectors). */
.jtg-range-modal .modal-dialog { width: auto; max-width: 640px; }
.jtg-range .jtg-range-cols { display: flex; gap: 20px; flex-wrap: wrap; }
.jtg-range .jtg-range-col { display: flex; flex-direction: column; gap: 6px; }
.jtg-range .jtg-range-label { font-weight: 600; font-size: 13px; }
.jtg-range .jtg-range-clear { font-weight: 400; font-size: 12px; margin-left: 6px; cursor: pointer; }
.jtg-range [uib-datepicker] table { margin: 0; }
.jtg-range [uib-timepicker] table { margin: 4px 0 0; }
.jtg-range .jtg-range-err { color: #d9534f; font-size: 13px; margin-top: 10px; }
</style>
<div class="widget widget-container chart">
    <div class="display-flex-space-between margin-chart">
        <div class="padding-right-0 padding-left-0 widget-dashboard-title-width"
            data-ng-class="(page === 'dashboard' || page === 'reporting') ? 'widget-dashboard-title-width' : 'widget-title-width'">
            <h5 data-ng-if="config.title !==''" class="padding-left-lg margin-top-0 margin-bottom-0 text-overflow">
                {{config.title}}</h5>
        </div>
        <div class="padding-right-0 padding-left-0 widget-dashboard-title-width"
            data-ng-class="(page === 'dashboard' || page === 'reporting') ? 'widget-dashboard-title-width' : 'widget-title-width'">
        </div>
    </div>
    <div class="clearfix"></div>
    <div class="alert alert-warning margin-left-lg margin-right-lg" data-ng-if="gridError">
        {{gridError}}
    </div>
    <div class="text-center" data-ng-if="loadProcessing && !gridError">
        <cs-spinner class="state-wait" data-show-background="true"></cs-spinner>
        <div class="font-size-14">Fetching Grid Data ...</div>
    </div>
    <div class="row" data-ng-show="!loadProcessing">
        <div class="col-md-12 margin-bottom-30 padding-left-28 padding-right-30">
            <div data-ng-if="refreshProcessing"
                style="position: absolute; top:0; height:100%; background-color:rgba(238, 238, 238, 0.3); z-index:999; width:100%;">
                <cs-spinner class="state-wait" data-show-background="true"></cs-spinner>
                <div class="text-center padding-top-18px">Fetching Grid Data ...</div>
            </div>
            <div data-paged-collection="gridPagedCollection" class="grid-widget-container" data-ng-class="{'no-pointer-events':refreshProcessing}" data-cs-grid
                data-grid-options="gridOptions" data-column-defs="columnDefs"></div>
            <div class="muted-50 font-size-14 text-center padding-top-md"
                data-ng-if="!loadProcessing && !refreshProcessing && gridOptions.data.length === 0">No Results Found
            </div>
        </div>
    </div>
</div>
